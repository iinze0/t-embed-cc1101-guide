; Smallest T-Embed CC1101 / Plus app. Screen only.
; Build: pio run
; App binary: .pio/build/tembed-cc1101/firmware.bin
; Install that file into a launcher slot. Do not flash firmware.factory.bin
; over a launcher unless you mean to erase it.

[env:tembed-cc1101]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
